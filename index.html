<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNIPOD design lab attendance</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1b1b1f;--mut:#6b6b75;--line:#e3e1da;--acc:#1f4bff;--acc-ink:#fff;--ok:#12805c;--bad:#c4361f}
@media (prefers-color-scheme:dark){:root{--bg:#131316;--card:#1c1c21;--ink:#f0f0f3;--mut:#9a9aa6;--line:#2c2c33;--acc:#6d8bff;--acc-ink:#0b0b10;--ok:#3ecf9a;--bad:#ff7a63}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;flex-wrap:wrap}
h1{font-size:1.25rem;margin:0}h1 span{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.out{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
button.sm{padding:6px 10px;font-size:.85rem}button:disabled{opacity:.5}
input{font:inherit;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
.clock{font-size:2.2rem;font-weight:700;text-align:center}.date{text-align:center;color:var(--mut);margin-bottom:18px}
.list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left}
.tag{font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--mut)}.tag.in{color:var(--ok);border:1px solid var(--ok)}
.sel{text-align:center;padding:10px 0}.sel h2{margin:0 0 4px}
.msg{margin-top:12px;text-align:center;color:var(--ok);min-height:1.4em}.msg.err{color:var(--bad)}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.stats{display:flex;gap:12px;margin:14px 0;flex-wrap:wrap}.stat{flex:1;min-width:120px;background:var(--bg);border-radius:10px;padding:12px}.stat b{display:block;font-size:1.6rem}
.row{display:flex;gap:8px;margin-bottom:12px}.row input{margin:0}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:480px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:.92rem}th{color:var(--mut)}
.hide{display:none}.mut{color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
<header><h1><span>UNIPOD</span> design lab attendance</h1><div id="nav"></div></header>
<div id="status" class="card mut hide"></div>

<section id="worker" class="card">
  <div class="clock" id="clock"></div><div class="date" id="today"></div>
  <input type="text" id="q" placeholder="Search your name…" autocomplete="off">
  <div class="list" id="results"></div>
  <div class="sel hide" id="sel"><h2 id="selName"></h2><div class="mut" id="selInfo"></div>
    <div style="margin-top:14px"><button id="act"></button> <button id="cancel">Back</button></div></div>
  <div class="msg" id="msg"></div>
</section>

<section id="login" class="card hide">
  <h2 style="margin-top:0">Admin login</h2>
  <input type="text" id="em" placeholder="Admin email" autocomplete="username">
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
  <button class="p" id="loginBtn">Log in</button>
  <div class="msg err" id="loginMsg"></div>
</section>

<section id="admin" class="hide">
  <div class="tabs"><button id="tAtt" class="on">Attendance</button><button id="tStaff">Staff list</button></div>
  <div class="card" id="pAtt">
    <div class="row"><input type="date" id="day"><button id="csv" class="sm">Download CSV</button></div>
    <div class="stats"><div class="stat"><b id="nIn">0</b>Signed in now</div><div class="stat"><b id="nAll">0</b>Total sign-ins</div></div>
    <h3 style="margin:8px 0">Live activity</h3><div class="list" id="feed" style="margin-bottom:18px"></div>
    <div class="scroll"><table><thead><tr><th>Name</th><th>Signed in</th><th>Signed out</th><th>Hours</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
  <div class="card hide" id="pStaff">
    <div class="row"><input type="text" id="newName" placeholder="New worker’s full name"><button class="p" id="add">Add</button></div>
    <div class="list" id="staffList"></div>
  </div>
</section>
</div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const tfmt=t=>t?new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"—";
const say=(t,err)=>{const m=$("msg");m.textContent=t;m.className="msg"+(err?" err":"")};
function tick(){const d=new Date();$("clock").textContent=d.toLocaleTimeString();$("today").textContent=d.toLocaleDateString([],{weekday:"long",year:"numeric",month:"long",day:"numeric"})}
tick();setInterval(tick,1000);

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let isAdmin=false,staff=[],status={},att=[],picked=null,view="worker",unsubs=[];

function showView(v){
  view=v;
  ["worker","login","admin"].forEach(x=>$(x).classList.toggle("hide",x!==v));
  const n=$("nav");n.innerHTML="";const b=document.createElement("button");b.className="sm";
  if(isAdmin){b.textContent=v==="admin"?"Sign-in screen":"Admin dashboard";b.onclick=()=>showView(v==="admin"?"worker":"admin");n.appendChild(b);
    const o=document.createElement("button");o.className="sm";o.textContent="Log out";o.onclick=()=>signOut(auth);n.append(" ",o)}
  else{b.textContent=v==="login"?"Back":"Admin login";b.onclick=()=>showView(v==="login"?"worker":"login");n.appendChild(b)}
}

function renderResults(){
  const q=$("q").value.trim().toLowerCase(),box=$("results");box.innerHTML="";
  if(picked||!q)return;
  staff.filter(s=>s.name.toLowerCase().includes(q)).slice(0,8).forEach(s=>{
    const b=document.createElement("button");b.className="item";
    const a=document.createElement("span");a.textContent=s.name;
    const t=document.createElement("span"),open=status[s.id]&&status[s.id].open;
    t.className="tag"+(open?" in":"");t.textContent=open?"Signed in":"Not signed in";
    b.append(a,t);b.onclick=()=>pick(s);box.appendChild(b);
  });
  if(!box.children.length){const p=document.createElement("div");p.className="mut";p.textContent="No match. Ask an admin to add your name.";box.appendChild(p)}
}
function pick(s){picked=s;say("");$("results").innerHTML="";$("q").classList.add("hide");$("sel").classList.remove("hide");refreshSel()}
function refreshSel(){
  if(!picked)return;const st=status[picked.id],open=st&&st.open;
  $("selName").textContent=picked.name;
  $("selInfo").textContent=open?"Signed in at "+tfmt(st.since):"You are not signed in";
  const a=$("act");a.textContent=open?"Sign out":"Sign in";a.className=open?"out":"p";a.disabled=false;
}
function reset(){picked=null;$("sel").classList.add("hide");$("q").classList.remove("hide");$("q").value="";renderResults()}
$("cancel").onclick=()=>{say("");reset()};$("q").oninput=renderResults;

$("act").onclick=async()=>{
  if(!picked)return;const btn=$("act");btn.disabled=true;
  try{
    const sref=doc(db,"status",picked.id),cur=await getDoc(sref),st=cur.exists()?cur.data():null,now=Date.now();
    if(st&&st.open){
      await updateDoc(doc(db,"attendance",st.recId),{signOut:now});
      await setDoc(sref,{name:picked.name,open:false,recId:null,since:null});
      say("Goodbye, "+picked.name+". Signed out at "+tfmt(now)+".");
    }else{
      const r=await addDoc(collection(db,"attendance"),{staffId:picked.id,name:picked.name,date:dkey(new Date(now)),signIn:now,signOut:null});
      await setDoc(sref,{name:picked.name,open:true,recId:r.id,since:now});
      say("Welcome, "+picked.name+". Signed in at "+tfmt(now)+".");
    }
    reset();
  }catch(e){say("Could not save. Check your connection and try again.",true);btn.disabled=false}
};

function renderAdmin(){
  const day=$("day").value||dkey(new Date()),rows=att.filter(r=>r.date===day),tb=$("rows");tb.innerHTML="";
  rows.forEach(r=>{const tr=document.createElement("tr");
    [r.name,tfmt(r.signIn),r.signOut?tfmt(r.signOut):"Still in",r.signOut?((r.signOut-r.signIn)/36e5).toFixed(2):""].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});tb.appendChild(tr)});
  if(!rows.length){const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=4;td.className="mut";td.textContent="No sign-ins for this date.";tr.appendChild(td);tb.appendChild(tr)}
  $("nAll").textContent=rows.length;$("nIn").textContent=rows.filter(r=>!r.signOut).length;
  const ev=[];rows.forEach(r=>{ev.push({n:r.name,t:r.signIn,k:"in"});if(r.signOut)ev.push({n:r.name,t:r.signOut,k:"out"})});
  ev.sort((a,b)=>b.t-a.t);const fd=$("feed");fd.innerHTML="";
  ev.slice(0,12).forEach(e=>{const d=document.createElement("div");d.className="item";d.style.cssText="padding:8px 0;border-bottom:1px solid var(--line)";
    const a=document.createElement("span");a.textContent=e.n;const b=document.createElement("span");b.className="tag"+(e.k==="in"?" in":"");b.textContent=(e.k==="in"?"Signed in ":"Signed out ")+tfmt(e.t);d.append(a,b);fd.appendChild(d)});
  if(!ev.length){const p=document.createElement("div");p.className="mut";p.textContent="No activity yet for this date.";fd.appendChild(p)}
  const sl=$("staffList");sl.innerHTML="";
  staff.forEach(s=>{
    const d=document.createElement("div");d.className="item card";d.style.padding="10px 14px";
    const n=document.createElement("span");n.textContent=s.name;const b=document.createElement("button");b.className="sm";b.textContent="Remove";
    let armed=false,tm=null;
    b.onclick=async()=>{if(!armed){armed=true;b.textContent="Tap again to confirm";b.className="sm out";tm=setTimeout(()=>{armed=false;b.textContent="Remove";b.className="sm"},4000);return}
      clearTimeout(tm);b.disabled=true;try{await deleteDoc(doc(db,"staff",s.id))}catch(e){b.disabled=false;armed=false;b.textContent="Could not remove, try again";b.className="sm"}};
    d.append(n,b);sl.appendChild(d)});
  if(!staff.length){const p=document.createElement("div");p.className="mut";p.textContent="No workers yet. Add the first name above.";sl.appendChild(p)}
}
$("day").value=dkey(new Date());$("day").onchange=renderAdmin;
$("tAtt").onclick=()=>{$("pAtt").classList.remove("hide");$("pStaff").classList.add("hide");$("tAtt").classList.add("on");$("tStaff").classList.remove("on")};
$("tStaff").onclick=()=>{$("pStaff").classList.remove("hide");$("pAtt").classList.add("hide");$("tStaff").classList.add("on");$("tAtt").classList.remove("on")};
$("add").onclick=async()=>{
  const name=$("newName").value.trim();if(!name)return;
  if(staff.some(s=>s.name.toLowerCase()===name.toLowerCase())){$("newName").value="";$("newName").placeholder="That name is already on the list";return}
  try{await addDoc(collection(db,"staff"),{name});$("newName").value=""}catch(e){$("newName").placeholder="Could not add the name, try again"}
};
$("csv").onclick=()=>{
  const day=$("day").value,q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const lines=["Name,Date,Sign in,Sign out"].concat(att.filter(r=>r.date===day).map(r=>[q(r.name),day,tfmt(r.signIn),r.signOut?tfmt(r.signOut):""].join(",")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));a.download="unipod-attendance-"+day+".csv";a.click();
};
$("loginBtn").onclick=async()=>{
  $("loginMsg").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}catch(e){$("loginMsg").textContent="Login failed. Check your email and password."}
};

function listen(){
  unsubs.forEach(u=>u());unsubs=[];
  unsubs.push(onSnapshot(collection(db,"staff"),s=>{staff=s.docs.map(d=>({id:d.id,name:String(d.data().name||"")})).sort((a,b)=>a.name.localeCompare(b.name));renderResults();renderAdmin()},()=>{}));
  unsubs.push(onSnapshot(collection(db,"status"),s=>{status={};s.docs.forEach(d=>status[d.id]=d.data());renderResults();refreshSel()},()=>{}));
  if(isAdmin)unsubs.push(onSnapshot(query(collection(db,"attendance"),orderBy("signIn","desc")),s=>{att=s.docs.map(d=>({id:d.id,...d.data()}));renderAdmin()},()=>{}));
}

onAuthStateChanged(auth,async user=>{
  if(!user){try{await signInAnonymously(auth)}catch(e){const s=$("status");s.textContent="Could not connect. Check firebase-config.js and that Anonymous sign-in is enabled.";s.classList.remove("hide")}return}
  isAdmin=false;
  if(!user.isAnonymous){try{isAdmin=(await getDoc(doc(db,"admins",user.uid))).exists()}catch(e){}
    if(!isAdmin){await signOut(auth);$("loginMsg").textContent="This account is not an admin.";showView("login");return}}
  listen();showView(isAdmin?"admin":"worker");
});
</script>
</body>
</html>
