<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,sans-serif;min-height:100vh;padding-bottom:84px}

.mono{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--mute)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0}
textarea{min-height:90px;resize:vertical}
button{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button.p{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
button.x{padding:4px 10px;color:var(--mute)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;overflow-x:auto}
nav button{flex:1 0 auto;min-width:62px;border:0;background:none;font-size:.78rem;padding:8px 2px;color:var(--mute);border-radius:8px}
nav button.on{color:var(--gold);font-weight:600;background:var(--surf2)}
.big{font-family:Fraunces,serif;font-size:3rem;color:var(--gold);line-height:1}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}
.done{text-decoration:line-through;color:var(--mute)}
.empty{color:var(--mute);padding:8px 0}
.media{width:100%;border-radius:12px;max-height:70vh;object-fit:contain;background:var(--surf2);display:block}
body{background:radial-gradient(900px 420px at 85% -10%,var(--glow) 0,transparent 70%),var(--bg)}
.brand{display:none;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
@media (min-width:900px){nav{top:0;right:auto;width:250px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:20px 12px;gap:4px}nav button{flex:0 0 auto;text-align:left;padding:12px 14px;font-size:.95rem}.brand{display:block}body{padding-bottom:0;padding-left:250px}main{max-width:860px}}
.bar{height:8px;background:var(--surf2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:var(--surf2);margin:0 3px;border-radius:12px}
nav button .ic{font-size:1.15rem;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--surf);border:1px solid var(--line)}
nav button.on{background:var(--surf);border-color:var(--gold);color:var(--gold)}
a.btn{display:inline-block;background:var(--gold);color:var(--gold-ink);padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:600}
button.box{display:flex;align-items:center;gap:8px;border-radius:12px}
@media (min-width:900px){nav button{flex-direction:row;gap:12px;margin:0;text-align:left}}
.dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#2ecc71;border:2px solid var(--surf)}
</style>

<script>
var KEY='kings-study-v1',DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var S={rec:{},quotes:[],tt:[],tasks:[],grades:[],journal:[],qs:[],results:[],target:4.5};
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
document.documentElement.setAttribute('data-theme',S.theme||'dark');
var tab='home',test=null;
var TABS=[['home','Home'],['tt','Daily Timetable'],['lec','Lectures'],['chat','Chat'],['cbt','CBT Centre'],['lib','Library'],['vault','Community'],['gpa','Academic Records']];
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function go(t){tab=t;test=null;logAct('tab_'+t);render()}
function render(){
  if(!authOK()){$('nav').innerHTML='';$('app').innerHTML=authView();return}
  chatBoot();
  drawNav();
  $('app').innerHTML=({home:home,tt:ttView,lec:lecView,chat:chatView,cbt:cbtView,vault:vaultView,lib:libView,set:setView,admin:adminView,gpa:recView,jr:jrView})[tab]();
  window.scrollTo(0,0);
}
/* HOME */
function home(){
  var d=new Date(),dn=DAYS[d.getDay()];
  var cl=S.tt.filter(function(x){return x.day==dn}).sort(function(a,b){return a.start>b.start?1:-1});
  var open=S.tasks.filter(function(t){return !t.done});
  setTimeout(fillNotes,0);return '<div class="row"><p class="mono">KINGS · Study Companion</p><button class="box" onclick="go(\'set\')" aria-label="Settings">'+avatarHTML(28)+' ⚙️ Settings</button></div><h1>'+dn+', '+d.toLocaleDateString('en-GB',{day:'numeric',month:'long'})+'</h1>'+'<div class="grid" style="margin-top:14px"><div class="card"><p class="mono">Today’s lectures</p><div class="big">'+cl.length+'</div></div><div class="card"><p class="mono">Pending tasks</p><div class="big">'+open.length+'</div></div><div class="card"><p class="mono">Saved questions</p><div class="big">'+S.qs.length+'</div></div><div class="card"><p class="mono">Current CGPA</p><div class="big">'+(allRec().u?allRec().gpa.toFixed(2):'—')+'</div></div></div>'+
  '<h2>Messages</h2><div id="hn"></div>'+'<h2>Today’s lectures</h2>'+(cl.length?cl.map(function(c){return '<div class="card"><h3>'+esc(c.course)+'</h3><span class="mono">'+c.start+'–'+c.end+(c.venue?' · '+esc(c.venue):'')+'</span></div>'}).join(''):'<p class="empty">No lectures today. Add classes in Timetable.</p>')+
  '<h2>Tasks</h2><div class="row"><input id="nt" placeholder="Add a task or assignment"><button class="p" onclick="addTask()">Add</button></div>'+
  (S.tasks.length?S.tasks.map(function(t,i){return '<div class="card row"><label style="flex:1"><input type="checkbox" style="width:auto" '+(t.done?'checked':'')+' onchange="togTask('+i+')"> <span class="'+(t.done?'done':'')+'">'+esc(t.t)+'</span></label><button class="x" onclick="delTask('+i+')" aria-label="Delete task">✕</button></div>'}).join(''):'<p class="empty">Nothing to do yet.</p>')+
  '<p class="mono">'+open.length+' open · data stays on this device</p>'+
  '';
}
function addTask(){var v=$('nt').value.trim();if(!v)return;S.tasks.unshift({t:v,done:false});save();render()}
function togTask(i){S.tasks[i].done=!S.tasks[i].done;save();render()}
function delTask(i){S.tasks.splice(i,1);save();render()}
function imp(el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{S=Object.assign(S,JSON.parse(r.result));save();render()}catch(e){alert('That file is not a valid backup.')}};r.readAsText(f)}
/* TIMETABLE */
function ttView(){
  var h='<h1>Daily timetable</h1><div class="card"><input id="tc" placeholder="Course (e.g. EEE 301)"><div class="grid"><select id="td">'+DAYS.slice(1).concat(DAYS[0]).map(function(d){return '<option>'+d+'</option>'}).join('')+'</select><input id="tv" placeholder="Venue"></div><div class="grid"><input id="ts" type="time" value="08:00"><input id="te" type="time" value="10:00"></div><button class="p" onclick="addTT()">Add class</button></div>';
  var any=false;
  DAYS.slice(1).concat(DAYS[0]).forEach(function(d){
    var l=S.tt.map(function(x,i){x.i=i;return x}).filter(function(x){return x.day==d}).sort(function(a,b){return a.start>b.start?1:-1});
    if(l.length){any=true;h+='<h2>'+d+'</h2>'+l.map(function(c){return '<div class="card row"><div><h3>'+esc(c.course)+'</h3><span class="mono">'+c.start+'–'+c.end+(c.venue?' · '+esc(c.venue):'')+'</span></div><button class="x" onclick="delTT('+c.i+')" aria-label="Delete class">✕</button></div>'}).join('')}
  });
  return h+(any?'':'<p class="empty">Add your first class above.</p>');
}
function addTT(){var c=$('tc').value.trim();if(!c)return;S.tt.push({course:c,day:$('td').value,venue:$('tv').value.trim(),start:$('ts').value,end:$('te').value});save();render()}
function delTT(i){S.tt.splice(i,1);save();render()}
/* GRADES */
var PT={A:5,B:4,C:3,D:2,E:1,F:0};
function calc(list){var u=0,p=0;list.forEach(function(g){u+=+g.cu;p+=+g.cu*PT[g.grade]});return u?{gpa:p/u,u:u,p:p}:{gpa:0,u:0,p:0}}
function gpaView(){
  var all=calc(S.grades),sems=[];
  S.grades.forEach(function(g){if(sems.indexOf(g.sem)<0)sems.push(g.sem)});
  var h='<h1>Academic records</h1><div class="card"><p class="mono">Cumulative CGPA (5.0 scale)</p><div class="big">'+all.gpa.toFixed(2)+'</div><p class="mono">'+all.u+' credit units</p><label class="mono">Target CGPA</label><input id="tg" type="number" step="0.01" min="0" max="5" value="'+S.target+'" onchange="S.target=+this.value;save();render()">'+targetNote(all)+'</div>';
  h+='<div class="card"><input id="gc" placeholder="Course code"><div class="grid"><input id="gu" type="number" min="1" max="8" placeholder="Credit units"><select id="gg">'+Object.keys(PT).map(function(k){return '<option>'+k+'</option>'}).join('')+'</select></div><input id="gs" placeholder="Semester (e.g. 300L First)"><button class="p" onclick="addG()">Add result</button></div>';
  sems.forEach(function(s){var l=S.grades.map(function(x,i){x.i=i;return x}).filter(function(x){return x.sem==s});h+='<h2>'+esc(s)+' · GPA '+calc(l).gpa.toFixed(2)+'</h2>'+l.map(function(g){return '<div class="card row"><span><b>'+esc(g.course)+'</b> <span class="mono">'+g.cu+' CU</span></span><span class="row"><b>'+g.grade+'</b><button class="x" onclick="delG('+g.i+')" aria-label="Delete result">✕</button></span></div>'}).join('')});
  return h;
}
function targetNote(a){
  if(!a.u)return '';
  var nextCU=24,need=(S.target*(a.u+nextCU)-a.p)/nextCU;
  var m=need>5?'A '+S.target+' needs more than 5.0 next semester on '+nextCU+' units, so aim to close the gap over two semesters.':need<=0?'You are already above target. Keep your grades steady.':'Over a next semester of '+nextCU+' units, you need a GPA of about <b>'+need.toFixed(2)+'</b> to reach '+S.target+'.';
  return '<p>'+m+'</p>';
}
function addG(){var c=$('gc').value.trim(),u=+$('gu').value,s=$('gs').value.trim();if(!c||!u||!s){alert('Enter course, credit units and semester.');return}S.grades.push({course:c,cu:u,grade:$('gg').value,sem:s});save();render()}
function delG(i){S.grades.splice(i,1);save();render()}
/* JOURNAL */
function jrView(){
  var t=S.journal.find(function(j){return j.date==today()})||{text:'',tomorrow:''};
  return '<h1>Daily journal</h1><div class="card"><label class="mono">How did today go?</label><textarea id="jt">'+esc(t.text)+'</textarea><label class="mono">Tomorrow’s priorities</label><textarea id="jm">'+esc(t.tomorrow)+'</textarea><button class="p" onclick="saveJ()">Save today’s entry</button></div>'+
  '<h2>Past entries</h2>'+(S.journal.length?S.journal.slice().sort(function(a,b){return a.date<b.date?1:-1}).map(function(j){return '<div class="card"><span class="mono">'+j.date+'</span><p>'+esc(j.text)+'</p>'+(j.tomorrow?'<p class="mono">Next: '+esc(j.tomorrow)+'</p>':'')+'</div>'}).join(''):'<p class="empty">Your entries will appear here.</p>');
}
function saveJ(){var d=today(),e=S.journal.find(function(j){return j.date==d});if(!e){e={date:d};S.journal.push(e)}e.text=$('jt').value;e.tomorrow=$('jm').value;save();render()}
/* CBT */
var timer=null;
function mergeQs(l){var n=0;l.forEach(function(x){if(x&&typeof x.q=='string'&&typeof x.course=='string'&&Array.isArray(x.o)&&x.o.length==4&&Number.isInteger(x.a)&&x.a>=0&&x.a<4&&!S.qs.some(function(y){return y.course==x.course&&y.q==x.q})){S.qs.push({course:x.course,q:x.q,o:x.o.map(String),a:x.a,e:x.e||''});n++}});save();return n}
async function saveFile(name,data){try{var d=window.claude?await claude.use('downloads'):null;if(!d){alert('Saving files works only when the app is opened inside Claude.');return}await d.save({filename:name,data:data})}catch(e){}}
function expScores(){var rows=['Date,Course,Mode,Score,Total'].concat(S.results.map(function(r){return [r.date,'"'+String(r.course).replace(/"/g,'""')+'"',r.mode=='e'?'Exam':'Practice',r.score,r.total].join(',')}));saveFile('cbt-scores.csv',rows.join('\n'))}
function expQs(){saveFile('cbt-questions.json',JSON.stringify(S.qs,null,1))}
function impQs(el){var f=el.files[0];el.value='';if(!f)return;var r=new FileReader();r.onload=function(){try{var n=mergeQs(JSON.parse(r.result));alert(n+' new questions added.');render()}catch(e){alert('That file is not a questions export.')}};r.readAsText(f)}
var CBM='t',CSL=[];
function cbtView(){
  if(test)return testView();
  var cs=[];S.qs.forEach(function(q){if(cs.indexOf(q.course)<0)cs.push(q.course)});CSL=cs;
  var h='<h1>CBT Centre</h1><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">'+[['t','Take a test'],['q','Question bank']].map(function(m){return '<button class="'+(CBM==m[0]?'p':'')+'" onclick="CBM=\''+m[0]+'\';render()">'+m[1]+'</button>'}).join('')+'</div>';
  var sel='<label class="mono">Course</label><select id="cc">'+cs.map(function(c){return '<option>'+esc(c)+'</option>'}).join('')+'</select>';
  var none='<div class="card"><p class="empty">You have no questions yet. Add some in the Question bank, or receive a set from the Library.</p></div>';
  if(CBM=='t'){
    h+=cs.length?'<div class="card"><h3>Take a test</h3>'+sel+'<label class="mono">Number of questions</label><input id="cn" type="number" min="1" value="20"><label class="mono"><input id="cuse" type="checkbox" style="width:auto" onchange="$(\'cmw\').style.display=this.checked?\'block\':\'none\'"> Timed test</label><div id="cmw" style="display:none"><label class="mono">Test duration (minutes)</label><input id="cm" type="number" min="1" value="30"></div><button class="p" style="width:100%;margin-top:8px" onclick="startTest(\'t\')">Start test</button></div>':none;
    var ex=S.results.slice(-8).reverse();
    if(ex.length)h+='<h2>Recent scores</h2>'+ex.map(function(r){return '<div class="card row"><span><b>'+esc(r.course)+'</b> <span class="mono">'+r.date+'</span></span><b>'+r.score+'/'+r.total+'</b></div>'}).join('');
  }

    (sess=='rec'?'<div class="card"><h3>Live transcript</h3><p id="lt">'+(sr?esc(live):'Not turned on.')+'</p></div>':'');
  }else{
    h+='<div class="card"><h3>Record a lecture</h3><input id="lc" placeholder="Course (e.g. EEE 301)"><label class="mono"><input id="ltx" type="checkbox" style="width:auto"> Also try a live transcript (needs internet, may not work on every phone)</label><button class="p" onclick="startRec()">Start recording</button><p id="lerr" class="mono" style="color:var(--bad)"></p><p class="mono">If the recorder is blocked, record with your phone’s own recorder and attach the audio:</p><button onclick="$(\'laf\').click()">Use phone recorder or add audio</button><input id="laf" type="file" accept="audio/*" capture style="display:none" onchange="addAudio(this)"></div><div class="card"><h3>Jot lecture points</h3><p class="mono">Separate from recording. Just type your points as the lecture goes.</p><input id="lcn" placeholder="Course (e.g. EEE 301)"><button class="p" onclick="startNotes()">Start jotting</button></div>';
  }
  return h+'<div id="ll"></div><div id="ll3"></div>';
}
function tick(){clearInterval(recT);t0=Date.now();recT=setInterval(function(){var e=$('rt');if(e)e.textContent=fmt(Math.floor((Date.now()-t0)/1000))},1000)}
async function startRec(){
  var c=$('lc').value.trim(),wantTx=$('ltx')&&$('ltx').checked;
  if(!c){lerr('Enter the course first.');return}
  if(!window.MediaRecorder||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){lerr('This browser cannot record audio here. Use the phone recorder button below, or jot points only.');return}
  try{strm=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){lerr(e&&e.name=='NotAllowedError'?'Microphone access is blocked. Allow the microphone for this page in your browser settings, or use the phone recorder button below.':e&&e.name=='NotFoundError'?'No microphone was found on this device.':'Could not start the microphone ('+((e&&e.name)||'error')+'). Use the phone recorder button below.');return}
  try{
    chunks=[];live='';pts=[];recCourse=c;
    var mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].filter(function(t){return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t)})[0];
    mr=mt?new MediaRecorder(strm,{mimeType:mt}):new MediaRecorder(strm);
    mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=function(){finishSess(chunks.length?new Blob(chunks,{type:mr.mimeType||'audio/webm'}):null)};
    mr.start(1000);
  }catch(e){strm.getTracks().forEach(function(t){t.stop()});lerr('Recording could not start on this device. Use the phone recorder button below.');return}
  sr=null;
  if(wantTx){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){try{sr=new SR();sr.continuous=true;sr.interimResults=false;sr.lang='en-NG';
    sr.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)live+=e.results[i][0].transcript+' ';var el=$('lt');if(el)el.textContent=live};
    sr.onend=function(){if(sess=='rec')try{sr.start()}catch(x){}};sr.start()}catch(e){sr=null}}}
  sess='rec';tick();render();
}
function startNotes(){var c=$('lcn').value.trim();if(!c){lerr('Enter the course first.');return}recCourse=c;pts=[];live='';sess='notes';tick();render()}
function stopSess(){if(sess=='rec'&&mr&&mr.state!='inactive')mr.stop();else finishSess(null)}
function finishSess(blob){
  clearInterval(recT);if(sr)try{sr.stop()}catch(e){}if(strm)strm.getTracks().forEach(function(t){t.stop()});
  var id='L'+Date.now(),item={id:id,course:recCourse,date:today(),text:live.trim(),points:pts.slice(),dur:Math.floor((Date.now()-t0)/1000),audio:!!blob};
  sr=null;strm=null;sess=null;S.lec=S.lec||[];S.lec.push(item);save();logAct('lecture');
  if(blob)dbPut({id:id,kind:'lecaudio',audio:blob});
  render();
}
function addAudio(el){
  var f=el.files[0];el.value='';if(!f)return;var c=$('lc').value.trim();if(!c){lerr('Enter the course first, then attach the audio.');return}
  var id='L'+Date.now();S.lec=S.lec||[];S.lec.push({id:id,course:c,date:today(),text:'',points:[],dur:0,audio:true});save();logAct('lecture');
  dbPut({id:id,kind:'lecaudio',audio:f});render();
}
function addPoint(){var el=$('lp'),v=el.value.trim();if(!v)return;pts.push({at:Math.floor((Date.now()-t0)/1000),text:v.slice(0,300)});el.value='';el.focus();drawPts()}
function drawPts(){var e=$('lpl');if(e)e.innerHTML=pts.length?pts.map(function(p){return '<div class="card" style="margin:6px 0"><span class="mono">'+fmt(p.at)+'</span> '+esc(p.text)+'</div>'}).join(''):'<p class="empty">No points yet.</p>'}
function loadLec(){
  var e=$('ll');if(!e)return;
  var L=(S.lec||[]).slice().reverse();
  e.innerHTML=L.length?L.map(function(l){var i=S.lec.indexOf(l);return '<div class="card"><div class="row"><h3>'+esc(l.course)+'</h3><span class="mono">'+l.date+(l.dur?' · '+fmt(l.dur):'')+'</span></div><div id="au-'+l.id+'"></div>'+(l.points&&l.points.length?'<p class="mono" style="margin:8px 0 2px">Points jotted</p>'+l.points.map(function(p){return '<div><span class="mono">'+fmt(p.at)+'</span> '+esc(p.text)+'</div>'}).join(''):'')+'<label class="mono">Notes</label><textarea onchange="S.lec['+i+'].text=this.value;save()">'+esc(l.text||'')+'</textarea><button class="x" onclick="delLec('+i+')">Delete</button></div>'}).join(''):'<p class="empty">Your lectures, points and notes will appear here.</p>';
  dbAll(function(a){
    a.forEach(function(x){if(x.kind=='lecaudio'&&x.audio){var h=$('au-'+x.id);if(h)h.innerHTML='<audio controls style="width:100%;margin:8px 0" src="'+URL.createObjectURL(x.audio)+'"></audio>'}});
    var old=a.filter(function(x){return x.kind=='lecture'&&x.audio}).sort(function(x,y){return x.id<y.id?1:-1}),o=$('ll3');
    if(o&&old.length)o.innerHTML='<h2>Earlier recordings</h2>'+old.map(function(l){return '<div class="card"><div class="row"><h3>'+esc(l.course)+'</h3><span class="mono">'+l.date+'</span></div><audio controls style="width:100%;margin:8px 0" src="'+URL.createObjectURL(l.audio)+'"></audio><p style="white-space:pre-wrap">'+esc(l.text||'')+'</p></div>'}).join('');
  });
}
function delLec(i){var l=S.lec[i];if(!l||!confirm('Delete this lecture?'))return;S.lec.splice(i,1);save();render();dbDel(l.id)}
/* VAULT */
function myVaultView(){
  setTimeout(loadVault,0);
  var q=S.quotes.length?S.quotes[Math.floor(Math.random()*S.quotes.length)]:'';
  return '<h2>Saved offline</h2>'+(q?'<div class="card"><h3>'+esc(q)+'</h3></div>':'')+'<div class="card"><button class="p" onclick="$(\'vf\').click()">Add pictures, videos or music</button><input id="vf" type="file" multiple accept="image/*,video/*,audio/*" style="display:none" onchange="addMedia(this)"><div class="row" style="margin-top:10px"><input id="vq" placeholder="Save a quote or verse"><button onclick="addQuote()">Save</button></div></div><div id="vm"></div>'+
  (S.quotes.length?'<h2>Quotes</h2>'+S.quotes.map(function(x,i){return '<div class="card row"><span>'+esc(x)+'</span><button class="x" onclick="S.quotes.splice('+i+',1);save();render()" aria-label="Delete quote">✕</button></div>'}).join(''):'');
}
function addQuote(){var v=$('vq').value.trim();if(!v)return;S.quotes.unshift(v);save();render()}
function addMedia(el){var fs=Array.prototype.slice.call(el.files),n=0;if(!fs.length)return;fs.forEach(function(f,i){dbPut({id:'M'+Date.now()+'-'+i,kind:'media',type:f.type,name:f.name,blob:f},function(){if(++n==fs.length)render()})})}
function loadVault(){dbAll(function(a){
  var m=a.filter(function(x){return x.kind=='media'}).sort(function(x,y){return x.id<y.id?1:-1}),e=$('vm');if(!e)return;
  e.innerHTML=m.length?m.map(function(f){var u=URL.createObjectURL(f.blob),t=f.type||'',b;
    if(t.indexOf('image')==0)b='<img class="media" alt="'+esc(f.name)+'" src="'+u+'">';
    else if(t.indexOf('video')==0)b='<video class="media" controls preload="metadata" src="'+u+'"></video>';
    else b='<p>'+esc(f.name)+'</p><audio controls style="width:100%" src="'+u+'"></audio>';
    return '<div class="card">'+b+'<button class="x" onclick="dbDel(\''+f.id+'\',render)">Remove</button></div>'}).join(''):'<p class="empty">Add a few pictures, videos or songs while you have data. They will play offline.</p>';
})}
boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
